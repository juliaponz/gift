<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bozzollo Glass Gifts</title>
    <style>
        body { margin: 0; padding: 0; background: #f4f4f4; display: flex; justify-content: center; }
        .wrapper { position: relative; width: 100%; max-width: 600px; line-height: 0; }
        img { width: 100%; height: auto; display: block; }

        .touch-zone { 
            position: absolute; 
            cursor: pointer; 
            /* Синяя рамка для проверки, потом уберем */
            border: 2px solid blue; 
            background: rgba(0, 0, 255, 0.1);
            z-index: 10;
        }

        /* Настройка зоны ПРОМОКОДА */
        #promo-zone {
            top: 48%;    
            left: 15%;   
            width: 70%;  
            height: 8%;  
        }

        /* Настройка зоны МАГАЗИНА */
        #etsy-zone {
            top: 62%; 
            left: 15%; 
            width: 70%; 
            height: 10%;
        }

        #toast {
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 12px 24px;
            border-radius: 50px; font-family: sans-serif; opacity: 0; 
            transition: opacity 0.3s; pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <img src="bg.jpeg" alt="Gift Card">

    <div id="promo-zone" class="touch-zone" onclick="copyCode('CREATIVE50')"></div>
    <a href="https://bozzolloglass.etsy.com" id="etsy-zone" class="touch-zone"></a>
</div>

<div id="toast">Код скопирован!</div>

<script>
    function copyCode(text) {
        navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        });
    }
</script>

</body>
</html>
