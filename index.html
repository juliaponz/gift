<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: gray; display: flex; justify-content: center; }
        .container { position: relative; width: 100%; max-width: 600px; }
        img { width: 100%; display: block; }
        .box { 
            position: absolute; 
            border: 5px solid black; /* Жирная рамка, чтобы видеть зону */
            background: rgba(0,0,0,0.2); 
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="bg.jpg">
        
        <div class="box" style="top:45%; left:10%; width:80%; height:10%;" onclick="alert('Код скопирован!')"></div>
    </div>
</body>
</html>
