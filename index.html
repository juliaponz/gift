<style type="text/css">
/* Твой оригинальный стиль */
#page-container{position:absolute;top:0;left:0;margin:0;padding:0;border:0}
.pf{position:relative;background-color:white;overflow:hidden;margin:0;border:0}
.pc{position:absolute;border:0;padding:0;margin:0;top:0;left:0;width:100%;height:100%;overflow:hidden;display:block;transform-origin:0 0}
.bi{position:absolute;border:0;margin:0;}
.t{position:absolute;white-space:pre;font-size:1px;transform-origin:0 100%;}

/* Кнопка копирования, которую мы добавим */
#copy-btn {
    position: absolute;
    top: 50%;    /* Регулируй высоту здесь */
    left: 20%;   /* Регулируй положение слева здесь */
    width: 60%;  /* Ширина зоны клика */
    height: 10%; /* Высота зоны клика */
    cursor: pointer;
    z-index: 999;
    background: rgba(255,255,255,0.01); /* Почти прозрачная */
}

#toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); color: white; padding: 10px 20px;
    border-radius: 20px; font-family: sans-serif; display: none; z-index: 1000;
}
</style>
