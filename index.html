<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bozzollo Glass Gifts</title>
    <style>
        body { margin: 0; padding: 0; background: #f4f4f4; display: flex; justify-content: center; }
        .wrapper { position: relative; width: 100%; max-width: 600px; line-height: 0; }
        img { width: 100%; height: auto; display: block; }

        .touch-zone { 
            position: absolute; 
            cursor: pointer; 
            border: 2px solid blue; /* Синяя рамка для проверки */
            background: rgba(0, 0, 255, 0.1);
            z-index: 10;
        }

        /* 1. ЗОНА ПРОМОКОДА */
        #promo-zone {
            top: 60.5%;    
            left: 24%;   
            width: 52%;  
            height: 5.5%;  
        }

        /* 2. ЗОНА МАГАЗИНА (ETSY) */
        #etsy-zone {
            top: 70%; 
            left: 24%; 
            width: 52%; 
            height: 10%;
        }

        /* Всплывающее уведомление */
        #toast {
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px;
            border-radius: 50px; opacity: 0; transition: opacity 0.3s; z-index: 100;
            font-family: sans-serif; pointer-events: none;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <img src="bg.jpeg" alt="Gift Card">

    <div id="promo-zone" class="touch-zone" onclick="copyCode('CREATIVE50')"></div>
    <a href="https://bozzolloglass.etsy.com" id="etsy-zone" class="touch-zone"></a>
</div>

<div id="toast">Code CREATIVE50 copied!</div>

<script>
    function copyCode(text) {
        navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }).catch(err => {
            // Если браузер блокирует копирование, покажем запасное окно
            alert('Your code: ' + text);
        });
    }
</script>

</body>
</html>
